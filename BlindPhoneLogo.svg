<!-- Letter B, with outlined internal counters -->
<path fill="url(#bFill)" fill-rule="evenodd" d="M 438,428 L 641,428 C 718,428 762,464 752,527 C 747,559 730,579 698,594 C 746,615 772,647 758,703 C 743,772 686,808 611,808 L 388,808 Z M 520,499 L 508,579 L 614,579 C 641,579 658,565 662,541 C 666,516 652,499 628,499 Z M 498,650 L 483,730 L 612,730 C 638,730 657,716 661,693 C 666,667 648,650 621,650 Z"/>
<path d="M 442,428 L 641,428 C 711,428 750,459 751,514 C 728,475 687,465 629,465 L 463,465 Z" fill="url(#shine)" opacity=".35"/>
<!-- Letter P, with counter -->
<path fill="url(#pFill)" fill-rule="evenodd" d="M 783,473 L 987,473 C 1078,473 1136,515 1135,598 C 1133,687 1075,743 978,743 L 856,743 L 835,838 L 707,838 Z M 866,560 L 848,664 L 969,664 C 1008,664 1031,647 1032,613 C 1033,579 1011,560 972,560 Z"/>
<path d="M 783,473 L 984,473 C 1057,473 1108,504 1126,562 C 1094,520 1049,509 977,509 L 773,509 Z" fill="url(#shine)" opacity=".22"/>
