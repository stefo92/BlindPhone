<path d="M 889,182 C 974,196 1075,284 1125,422" fill="none" stroke="url(#signal)" stroke-width="73" stroke-linecap="round"/>
<path d="M 873,276 C 942,288 1003,347 1038,423" fill="none" stroke="url(#signal)" stroke-width="64" stroke-linecap="round"/>
<path d="M 855,365 C 892,369 927,391 952,431" fill="none" stroke="url(#signal)" stroke-width="53" stroke-linecap="round"/>
</svg>
