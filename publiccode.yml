description:
  it:
    localisedName: BlindPhone

    shortDescription: >
      Posto operatore di centralino per centralinisti non vedenti: si usa
      interamente da tastiera e dice a voce tutto quello che succede.

    longDescription: >
      BlindPhone e' un posto operatore di centralino telefonico pensato per
      essere usato senza guardare lo schermo, destinato ai centralinisti non
      vedenti e ipovedenti che le amministrazioni assumono ai sensi della
      Legge 113/1985 e ai quali devono fornire strumenti adeguati alla mansione
      ai sensi dell'articolo 4 comma 4 della Legge 4/2004.

      Non e' un softphone a cui e' stata aggiunta l'accessibilita': l'ascolto e'
      l'interfaccia principale e la tastiera e' l'unico dispositivo di comando
      necessario. Ogni comando produce un riscontro parlato, nessuna funzione
      richiede il mouse, e il cursore non si sposta da solo mentre l'operatore
      sta scrivendo.

      Funzioni principali: risposta e chiusura con un tasto singolo,
      trasferimento con annuncio o cieco con la stessa combinazione, conferenza
      a tre, inclusione su interno occupato secondo la RFC 3911, rubrica
      collegabile a file o a Microsoft SQL Server con ricerca mentre il telefono
      squilla, stato degli interni tramite sottoscrizioni SIP, elenco delle
      ultime chiamate con periodo di conservazione configurabile, e registro
      diagnostico anonimizzabile prima di essere condiviso con l'assistenza.

      Si collega a centralini SIP; l'integrazione estesa e' sviluppata e provata
      su Yeastar P-Series. Funziona interamente sulla postazione e parla solo con
      il centralino dell'ente: non ha componenti cloud.

      Sul piano normativo il riferimento tecnico e' la norma europea
      EN 301 549, capitoli 5, 6, 11 e 12. Lo stato di conformita' dichiarato,
      compresi gli scostamenti, e' nel documento
      docs/CONFORMITA-EN-301-549.md.

    features:
      - Uso completo da tastiera, senza mouse
      - Riscontro parlato per ogni comando
      - Interoperabilita' con NVDA e JAWS, e voce interna autonoma
      - Segnali acustici distinti per gli eventi di chiamata
      - Trasferimento con annuncio e trasferimento cieco
      - Conferenza a tre e inclusione su interno occupato
      - Rubrica da file o collegata a Microsoft SQL Server
      - Stato degli interni e coda di attesa
      - Tema chiaro, tema scuro e contrasto elevato di sistema
      - Scorciatoie riassegnabili, con scheda dei tasti in formato braille
      - Registri anonimizzabili prima della condivisione

